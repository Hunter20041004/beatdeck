<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--
  Beatdeck runtime skeleton — window.__beatdeck v1.0
  ---------------------------------------------------------------------------
  This file is CONTRACT ONLY. It deliberately has no visual style.
  Everything marked "DESIGN" is yours to replace with the chosen visual world
  (palette, type pairing, hero assets, composition archetype, motion tier).
  Everything marked "RUNTIME" implements the contract; change it only with care.
  Placeholder scenes carry data-beatdeck-skeleton, and lint.mjs warns until
  every one of them is replaced.
-->
<style>
  /* ============ DESIGN: tokens (replace with the chosen world) ============ */
  :root {
    --ground: #e9e9e6;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --accent: #6b6b6b;
    --font-display: Georgia, 'Noto Serif TC', 'Noto Serif CJK TC', serif;
    --font-body: system-ui, 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif;
    --font-mono: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --ease-cam: cubic-bezier(0.65, 0, 0.35, 1);
    --cam-ms: 900ms;
  }

  /* ============ RUNTIME: stage frame & modes (keep) ============ */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #viewport { position: fixed; inset: 0; overflow: hidden; }
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden;
    background: var(--ground); color: var(--ink); font-family: var(--font-body);
  }
  #world {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; transition: transform var(--cam-ms) var(--ease-cam);
  }
  /* Beat changes are animated by the runtime (see MOTION.transition / beat.transition). */
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; visibility: hidden; }
  .scene.is-active, .scene.is-leaving { opacity: 1; visibility: visible; }
  .scene.is-active { z-index: 2; }
  .scene.is-leaving { z-index: 1; pointer-events: none; }
  .scene.is-leaving.on-top { z-index: 3; }
  /* Parallax: elements with data-depth drift against the camera (translate is independent of transform). */
  [data-depth] { transition: translate var(--cam-ms) var(--ease-cam), scale var(--cam-ms) var(--ease-cam); }

  #subtitle {
    position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%);
    max-width: 1500px; padding: 12px 24px; display: none;
    font: 500 34px/1.35 var(--font-body); color: #fff; background: rgba(0, 0, 0, 0.62); text-align: center;
  }
  #subtitle.is-visible { display: block; }
  #camera-safe-zone {
    position: absolute; right: 0; bottom: 0; width: 400px; height: 300px; display: none;
    outline: 3px dashed rgba(220, 60, 40, 0.9); outline-offset: -3px; background: rgba(220, 60, 40, 0.12);
    pointer-events: none; z-index: 50;
  }
  #camera-safe-zone.is-open { display: block; }

  #hud {
    position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center;
    font: 12px/1 var(--font-mono); color: #ddd; background: rgba(0, 0, 0, 0.55); padding: 6px 10px;
    opacity: 0.25; transition: opacity 200ms ease; z-index: 100;
  }
  #hud:hover { opacity: 1; }
  #hud button { font: inherit; color: inherit; background: none; border: 1px solid #666; padding: 3px 7px; cursor: pointer; }
  #hud button.is-on { background: #ddd; color: #111; }
  #notes-drawer {
    position: fixed; right: 0; top: 0; bottom: 0; width: 440px; padding: 28px; box-sizing: border-box;
    background: #141414; color: #eee; font: 18px/1.5 var(--font-body);
    transform: translateX(100%); transition: transform 240ms ease; z-index: 110; overflow: auto;
  }
  #notes-drawer.is-open { transform: none; }
  #notes-drawer .nd-head { font: 12px/1.4 var(--font-mono); color: #aaa; letter-spacing: 0.06em; }
  #notes-drawer .nd-say { margin: 16px 0; font-size: 22px; }
  #notes-drawer .nd-cue { color: #f0c27a; }

  body.still *, body.still *::before, body.still *::after { transition: none !important; animation: none !important; }
  body.still #hud, body.still #notes-drawer, body.still #camera-safe-zone, body.still #subtitle,
  body.video #hud, body.video #notes-drawer, body.video #camera-safe-zone,
  body.bare #hud, body.bare #notes-drawer, body.bare #camera-safe-zone, body.bare #subtitle { display: none !important; }

  /* ============ DESIGN: placeholder scene styles (delete) ============ */
  [data-beatdeck-skeleton] .ph-title {
    position: absolute; left: 140px; top: 380px; margin: 0;
    font: 700 88px/1.05 var(--font-display); letter-spacing: -0.01em;
  }
  [data-beatdeck-skeleton] .ph-note {
    position: absolute; left: 140px; top: 520px; margin: 0;
    font: 400 26px/1.4 var(--font-mono); color: var(--muted);
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="world">
<!--BEATDECK:SCENES-->
    </div>
    <div id="subtitle" role="status" aria-live="polite"></div>
    <div id="camera-safe-zone" aria-hidden="true"></div>
  </div>
</div>

<aside id="notes-drawer" aria-label="Speaker notes">
  <div class="nd-head" id="nd-head"></div>
  <div class="nd-say" id="nd-say"></div>
  <div class="nd-cue" id="nd-cue"></div>
</aside>
<nav id="hud" aria-label="Presentation controls">
  <button type="button" id="btn-prev" aria-label="Previous beat">&larr;</button>
  <span id="hud-counter">01 / 01</span>
  <button type="button" id="btn-next" aria-label="Next beat">&rarr;</button>
  <button type="button" id="btn-notes" title="Speaker notes (N)">N</button>
  <button type="button" id="btn-cam" title="Camera safe zone (C)">C</button>
  <button type="button" id="btn-fs" title="Fullscreen (F)">F</button>
</nav>

<script>
(() => {
  "use strict";

  // ============ CONTENT: single source of truth ============
  // lintAllow: narration-wide lint exemptions, e.g. ["contrast-frame"]; see references/ai-tells.md §7.
  const META = { title: "{{TITLE}}", subtitle: "", lang: "{{LANG}}", width: 1920, height: 1080, speechRate: 3.6, lintAllow: [] };

  // One idea + one visual change per beat. `cam` positions the #world camera (logical px + zoom).
  const BEATS = [
/*BEATDECK:BEATS*/
  ];

  // Intra-beat choreography keyed by beat id. Each receives (scene element, helpers).
  // Every non-liveOnly step must settle synchronously under ?still (the helpers do this for you).
  const CHOREO = {
/*BEATDECK:CHOREO*/
  };

  // ============ DESIGN: motion register (replace with the chosen register) ============
  // Pick the register from what the talk is for (pitch, research, product, story, teaching) and let
  // the content decide each beat: most beats stay quiet (rise, unveil, fade); one or two moments where
  // the story turns get the signature move. See references/craft-and-direction.md §2.
  const MOTION = {
    // Default beat change. Override per beat with `transition: "wipe-left"` or
    // { type: "iris", ms: 700, origin: "#lens" | { x: 960, y: 540 }, ease: "inOut" }.
    // Types: cut, fade, dip (fade through the background), push-<dir>, cover-<dir>, reveal-<dir>, wipe-<dir>, iris, zoom, blur, match, camera
    // (<dir> = left | right | up | down; going back plays the same change in reverse).
    // Premium by default: most beats change with a quiet dip (the old beat fades out, then the new one
    // fades in, so two layouts never overlap). Spend anything louder on the one or two moments the story
    // turns (see references/craft-and-direction.md §2).
    transition: { type: "dip", ms: 720 },
    // Named easings, usable as `ease: "out"` in every helper. Long, soft decelerations read as expensive;
    // `snap` overshoots and is an accent, not a default.
    ease: {
      out: "cubic-bezier(0.16, 1, 0.3, 1)",
      in: "cubic-bezier(0.55, 0, 1, 0.45)",
      inOut: "cubic-bezier(0.65, 0, 0.35, 1)",
      snap: "cubic-bezier(0.3, 1.5, 0.6, 1)",
      linear: "linear",
    },
    // Default spring for spring() and `ease: { stiffness, damping }`: stiffer is faster, less damping overshoots more.
    // The default is critically damped (settles with no bounce). Lower damping only for play or physical worlds.
    spring: { stiffness: 170, damping: 26, mass: 1 },
  };

  // ============ RUNTIME (keep) ============
  const params = new URLSearchParams(location.search);
  const isStill = params.has("still");
  const isVideo = params.has("video");
  const isBare = params.has("bare");
  const chromeHidden = isStill || isVideo || isBare;
  if (isStill) document.body.classList.add("still");
  if (isVideo) document.body.classList.add("video");
  if (isBare) document.body.classList.add("bare");

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const world = $("world");
  const subtitleEl = $("subtitle");
  const camZone = $("camera-safe-zone");
  const notes = $("notes-drawer");
  const scenes = BEATS.map((b) => world.querySelector(`[data-beat="${b.id}"]`));
  let active = 0;
  let notesOpen = false;
  let camOpen = false;

  let timers = [];
  let rafs = [];
  function clearTimeline() {
    timers.forEach(clearTimeout);
    rafs.forEach(cancelAnimationFrame);
    timers = [];
    rafs = [];
  }

  // at(ms, fn, { liveOnly }) — schedule a step inside the current beat.
  function at(ms, fn, opts) {
    const liveOnly = Boolean(opts && opts.liveOnly);
    if (isStill) { if (!liveOnly) fn(); return; }
    if (ms <= 0) { fn(); return; }
    timers.push(setTimeout(fn, ms));
  }

  // ---- easing: names from MOTION.ease, CSS strings, functions, or springs { stiffness, damping, mass } ----
  const EASE_FN = {
    linear: (t) => t,
    in: (t) => t * t * t,
    out: (t) => 1 - Math.pow(1 - t, 3),
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    snap: (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };
  const springCache = new Map();
  // Simulate a damped spring from 0 to 1; returns { duration (ms), samples, easing: CSS linear() }.
  function springCurve(sp) {
    const k = (sp && sp.stiffness) || MOTION.spring.stiffness;
    const c = (sp && sp.damping) || MOTION.spring.damping;
    const m = (sp && sp.mass) || MOTION.spring.mass || 1;
    const key = `${k}/${c}/${m}`;
    if (springCache.has(key)) return springCache.get(key);
    const dt = 1 / 600;
    let x = 0, v = 0, t = 0;
    const raw = [0];
    while (t < 4) {
      const a = (-k * (x - 1) - c * v) / m;
      v += a * dt; x += v * dt; t += dt;
      raw.push(x);
      if (t > 0.05 && Math.abs(x - 1) < 0.001 && Math.abs(v) < 0.01) break;
    }
    raw[raw.length - 1] = 1;
    const n = 48;
    const samples = Array.from({ length: n + 1 }, (_, i) => raw[Math.round((i / n) * (raw.length - 1))]);
    const out = { duration: Math.round(t * 1000), samples, easing: `linear(${samples.map((s) => +s.toFixed(4)).join(", ")})` };
    springCache.set(key, out);
    return out;
  }
  const isSpring = (e) => Boolean(e && typeof e === "object" && ("stiffness" in e || "damping" in e || e.spring));
  function cssEase(e) {
    if (isSpring(e)) return springCurve(e).easing;
    if (typeof e === "string") return MOTION.ease[e] || e;
    return MOTION.ease.out;
  }
  function easeFn(e) {
    if (typeof e === "function") return e;
    if (isSpring(e)) { const s = springCurve(e).samples; return (t) => { const f = t * (s.length - 1); const i = Math.floor(f); return i >= s.length - 1 ? 1 : s[i] + (s[i + 1] - s[i]) * (f - i); }; }
    return EASE_FN[e] || EASE_FN.out;
  }

  // Lint hook: records which helper each beat used, so lint can count accents. No-op in a normal show.
  const note = (kind) => { const l = window.__bdHelperLog; if (l) l.push({ beat: window.__bdMotionBeat === undefined ? -1 : window.__bdMotionBeat, kind }); };

  // ---- WAAPI helpers: every Animation is tracked per scene, finished when the beat is left,
  // cancelled when the beat is entered again, and jumped to its end under ?still. ----
  const sceneAnims = new Map();
  let currentScene = null;
  function track(anim, infinite) {
    if (!currentScene) return anim;
    if (!sceneAnims.has(currentScene)) sceneAnims.set(currentScene, []);
    sceneAnims.get(currentScene).push({ anim, infinite });
    return anim;
  }
  function settleSceneAnims(el) { (sceneAnims.get(el) || []).forEach(({ anim, infinite }) => { try { infinite ? anim.cancel() : anim.finish(); } catch (_) { anim.cancel(); } }); }
  function cancelSceneAnims(el) { (sceneAnims.get(el) || []).forEach(({ anim }) => anim.cancel()); sceneAnims.delete(el); }
  const toEls = (t) => (!t ? [] : typeof t === "string" ? Array.from((currentScene || document).querySelectorAll(t)) : t instanceof Element ? [t] : Array.from(t));

  // animate(ms, onFrame(t∈[0,1]), { delay, liveOnly, ease }) — rAF tween, settles to t=1 under ?still.
  function animate(ms, onFrame, opts = {}) {
    const ease = easeFn(opts.ease);
    const dur = isSpring(opts.ease) && !opts.ms ? springCurve(opts.ease).duration : ms;
    at(opts.delay || 0, () => {
      if (isStill) { onFrame(1); return; }
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, Math.max(0, (now - start) / dur));
        onFrame(t >= 1 ? 1 : ease(t));
        if (t < 1) rafs.push(requestAnimationFrame(tick));
      };
      rafs.push(requestAnimationFrame(tick));
    }, opts);
  }

  // tween(target, keyframes, { ms, delay, ease, liveOnly }) — Web Animations keyframes, held at both ends.
  // target: element, list, or selector (scoped to the current scene). ease may be a spring.
  function tween(target, keyframes, opts = {}) {
    if (opts.liveOnly && isStill) return [];
    const spring = isSpring(opts.ease);
    const duration = opts.ms || (spring ? springCurve(opts.ease).duration : 600);
    return toEls(target).map((el) => {
      const anim = track(el.animate(keyframes, { duration, delay: opts.delay || 0, easing: cssEase(opts.ease), fill: "both", id: opts.kind || "tween" }));
      if (isStill) anim.finish();
      return anim;
    });
  }

  // spring(target, keyframes, { stiffness, damping, mass, delay }) — physical settle with real overshoot.
  function spring(target, keyframes, opts = {}) {
    const sp = { stiffness: opts.stiffness || MOTION.spring.stiffness, damping: opts.damping || MOTION.spring.damping, mass: opts.mass || MOTION.spring.mass };
    return tween(target, keyframes, { kind: "spring", ...opts, ease: sp, ms: opts.ms });
  }

  // stagger(targets, fn(el, delayMs, i), { each, from: "start"|"end"|"center"|"edges"|"random"|index, delay, seed })
  function stagger(targets, fn, opts = {}) {
    const els = toEls(targets);
    const n = els.length;
    const each = opts.each === undefined ? 70 : opts.each;
    const from = opts.from === undefined ? "start" : opts.from;
    let seed = opts.seed || 7;
    const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const randomOrder = from === "random" ? els.map((_, i) => [rand(), i]).sort((a, b) => a[0] - b[0]).map((p) => p[1]) : null;
    els.forEach((el, i) => {
      let rank;
      if (randomOrder) rank = randomOrder.indexOf(i);
      else if (from === "end") rank = n - 1 - i;
      else if (from === "center") rank = Math.abs(i - (n - 1) / 2);
      else if (from === "edges") rank = (n - 1) / 2 - Math.abs(i - (n - 1) / 2);
      else if (typeof from === "number") rank = Math.abs(i - from);
      else rank = i;
      fn(el, (opts.delay || 0) + rank * each, i);
    });
  }

  // splitText(el, { by: "char" | "word" }) — wrap text in inline-block spans (keeps <br> and child elements).
  // Returns the spans. Use "char" for CJK. Idempotent: calling again returns the same spans.
  function splitText(el, opts = {}) {
    if (!el) return [];
    note("splitText");
    const by = opts.by || "char";
    if (el.dataset.split === by) return Array.from(el.querySelectorAll(":scope .bd-split"));
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      const parts = by === "word" ? node.textContent.split(/(\s+)/) : Array.from(node.textContent);
      const frag = document.createDocumentFragment();
      parts.forEach((part) => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
        const span = document.createElement("span");
        span.className = "bd-split";
        span.style.display = "inline-block";
        span.textContent = part;
        frag.appendChild(span);
      });
      node.parentNode.replaceChild(frag, node);
    });
    el.dataset.split = by;
    return Array.from(el.querySelectorAll(":scope .bd-split"));
  }

  // rise(targets, { y: 18, ms: 900, each: 70, delay, blur: false, from }) — the quiet, premium entrance:
  // a short lift with a fade on a long deceleration. Use it for most content; it is meant to be invisible.
  function rise(targets, opts = {}) {
    const y = opts.y === undefined ? 18 : opts.y;
    const kf = { opacity: [0, 1], translate: [`0 ${y}px`, "0 0"] };
    if (opts.blur) kf.filter = [`blur(${opts.blur === true ? 6 : opts.blur}px)`, "blur(0px)"];
    note("rise");
    const out = [];
    stagger(targets, (el, d) => out.push(...tween(el, kf, { ms: opts.ms || 900, ease: opts.ease || "out", delay: d, kind: "rise" })),
      { each: opts.each === undefined ? 70 : opts.each, delay: opts.delay || 0, from: opts.from });
    return out;
  }

  // unveil(target, { from: "bottom", ms: 1000, delay, ease }) — editorial line reveal: the text rises out of
  // its own baseline mask. Use for headlines and key statements; one per beat at most.
  const UNVEIL_FROM = { bottom: ["inset(0 0 100% 0)", "0 0.5em"], top: ["inset(100% 0 0 0)", "0 -0.5em"], left: ["inset(0 100% 0 0)", "-0.4em 0"], right: ["inset(0 0 0 100%)", "0.4em 0"] };
  function unveil(target, opts = {}) {
    const [clip, off] = UNVEIL_FROM[opts.from || "bottom"] || UNVEIL_FROM.bottom;
    note("unveil");
    return tween(target, { clipPath: [clip, "inset(0 0 0 0)"], translate: [off, "0 0"] }, { ms: 1000, ease: "out", kind: "unveil", ...opts });
  }

  // focus(keep, { dim: 0.28, ms: 700, delay, within }) — emphasis without effects: everything else in the
  // scene (or `within`) recedes so `keep` stands alone. Prefer this to stamps and shakes.
  function focus(keep, opts = {}) {
    const keepEls = toEls(keep);
    const pool = opts.within ? toEls(opts.within) : Array.from((currentScene || document).querySelectorAll("[data-focus]"));
    note("focus");
    pool.filter((el) => !keepEls.includes(el) && !keepEls.some((k) => el.contains(k) || k.contains(el)))
      .forEach((el) => tween(el, { opacity: [1, opts.dim === undefined ? 0.28 : opts.dim] }, { ms: opts.ms || 700, delay: opts.delay || 0, ease: "inOut", kind: "focus" }));
    return keepEls;
  }

  // wipe(target, { from: "left"|"right"|"top"|"bottom"|"center", ms, delay, ease }) — hard-edged clip reveal.
  const WIPE_FROM = { left: "inset(0 100% 0 0)", right: "inset(0 0 0 100%)", top: "inset(0 0 100% 0)", bottom: "inset(100% 0 0 0)", center: "inset(0 50% 0 50%)", middle: "inset(50% 0 50% 0)" };
  function wipe(target, opts = {}) {
    note("wipe");
    return tween(target, { clipPath: [WIPE_FROM[opts.from || "left"] || WIPE_FROM.left, "inset(0 0 0 0)"] }, { ms: 700, ease: "inOut", kind: "wipe", ...opts });
  }

  // iris(target, { x: "50%", y: "50%", ms, delay, ease }) — circular aperture opening from a point.
  function iris(target, opts = {}) {
    const p = `${opts.x || "50%"} ${opts.y || "50%"}`;
    note("iris");
    return tween(target, { clipPath: [`circle(0% at ${p})`, `circle(150% at ${p})`] }, { ms: 800, ease: "inOut", kind: "iris", ...opts });
  }

  // stamp(target, { rotate: "-3deg", scale: 1.35, ms, delay, impact: element-to-shake }) — ink-stamp hit.
  // An accent: only where something is literally stamped or approved, at most once or twice per deck.
  function stamp(target, opts = {}) {
    const r = opts.rotate || "-3deg";
    const s0 = opts.scale || 1.35;
    note("stamp");
    const anims = tween(target, [
      { transform: `scale(${s0}) rotate(${r})`, opacity: 0, filter: "blur(4px)", easing: "cubic-bezier(0.55, 0, 1, 0.45)" },
      { transform: `scale(0.97) rotate(${r})`, opacity: 1, filter: "blur(0px)", offset: 0.6 },
      { transform: `scale(1) rotate(${r})`, opacity: 1, filter: "blur(0px)" },
    ], { ms: 460, ease: "linear", kind: "stamp", ...opts });
    if (opts.impact) shake(opts.impact, { delay: (opts.delay || 0) + (opts.ms || 460) * 0.6, amp: opts.amp || 3 });
    return anims;
  }

  // shake(target, { amp: 5, ms: 380, delay }) — decaying impact jolt on the `translate` property.
  // An accent for a physical impact the story actually has; never for "emphasis".
  function shake(target, opts = {}) {
    const a = opts.amp || 5;
    note("shake");
    const steps = [1, -0.8, 0.6, -0.4, 0.22, -0.1, 0];
    return tween(target, { translate: ["0 0", ...steps.map((s, i) => `${(s * a).toFixed(1)}px ${(i % 2 ? 0.4 : -0.4) * s * a}px`)] }, { ms: 380, ease: "linear", kind: "shake", ...opts });
  }

  // strike(target, { ms, delay, color, thickness: "0.09em" }) — a rule drawn through the text.
  function strike(target, opts = {}) {
    note("strike");
    return toEls(target).map((el) => {
      let bar = el.querySelector(":scope > .bd-strike");
      if (!bar) {
        if (getComputedStyle(el).position === "static") el.style.position = "relative";
        bar = document.createElement("span");
        bar.className = "bd-strike";
        bar.setAttribute("aria-hidden", "true");
        bar.style.cssText = `position:absolute;left:-0.06em;right:-0.06em;top:52%;height:${opts.thickness || "0.09em"};background:${opts.color || "currentColor"};transform-origin:0 50%;pointer-events:none;`;
        el.appendChild(bar);
      }
      return tween(bar, { transform: ["scaleX(0)", "scaleX(1)"] }, { ms: 460, ease: "inOut", kind: "strike", ...opts })[0];
    });
  }

  // draw(svgPath, ms, { delay, ease }) — stroke-dashoffset line drawing.
  function draw(pathEl, ms, opts = {}) {
    if (!pathEl) return;
    note("draw");
    const len = pathEl.getTotalLength ? pathEl.getTotalLength() : 1000;
    pathEl.style.strokeDasharray = `${len}`;
    pathEl.style.strokeDashoffset = `${len}`;
    animate(ms, (t) => { pathEl.style.strokeDashoffset = `${len * (1 - t)}`; }, opts);
  }

  // followPath(svgEl, svgPath, { ms, delay, ease, rotate, from: 0, to: 1 }) — move an SVG element along a path
  // (both inside the same <svg>). rotate: true turns it to face the direction of travel.
  function followPath(el, pathEl, opts = {}) {
    if (!el || !pathEl) return;
    note("followPath");
    const len = pathEl.getTotalLength();
    const a = opts.from || 0;
    const b = opts.to === undefined ? 1 : opts.to;
    const m = () => (el.parentNode.getCTM() || pathEl.getCTM()).inverse().multiply(pathEl.getCTM());
    animate(opts.ms || 1200, (t) => {
      const l = len * (a + (b - a) * t);
      const mm = m();
      const p = pathEl.getPointAtLength(l).matrixTransform(mm);
      let rot = "";
      if (opts.rotate) {
        const q = pathEl.getPointAtLength(Math.min(len, l + 1)).matrixTransform(mm);
        const o = pathEl.getPointAtLength(Math.max(0, l - 1)).matrixTransform(mm);
        rot = ` rotate(${(Math.atan2(q.y - o.y, q.x - o.x) * 180) / Math.PI})`;
      }
      el.setAttribute("transform", `translate(${p.x} ${p.y})${rot}`);
    }, { ease: "inOut", ...opts });
  }

  // morph(svgPath, toD, { ms, delay, ease }) — interpolate between two `d` strings with the same command
  // structure (same commands, same number count). Mismatched shapes snap to the target.
  function morph(pathEl, toD, opts = {}) {
    if (!pathEl) return;
    note("morph");
    const num = /-?\d*\.?\d+(?:e[-+]?\d+)?/gi;
    const fromD = opts.fromD || pathEl.getAttribute("d") || "";
    const a = (fromD.match(num) || []).map(Number);
    const b = (toD.match(num) || []).map(Number);
    const shape = (d) => d.replace(num, "#");
    if (a.length !== b.length || shape(fromD) !== shape(toD)) { at(opts.delay || 0, () => pathEl.setAttribute("d", toD)); return; }
    const parts = toD.split(num);
    animate(opts.ms || 800, (t) => {
      pathEl.setAttribute("d", parts.reduce((acc, s, i) => acc + s + (i < b.length ? +(a[i] + (b[i] - a[i]) * t).toFixed(2) : ""), ""));
    }, { ease: "inOut", ...opts });
  }

  // cursor(pointerEl, steps, { delay, ease, stepMs }) — move a pointer through stage-pixel waypoints (via
  // `translate`). A step is [x, y] or { x, y, ms, hold, click: targetEl, onClick }; a click presses the
  // pointer and adds .is-clicked to the target. One call per pointer per beat: chain clicks as steps.
  function cursor(pointerEl, steps, opts = {}) {
    if (!pointerEl || !steps || !steps.length) return;
    note("cursor");
    const delay = opts.delay || 0;
    let t = 0;
    const moves = [];
    const presses = [];
    steps.forEach((s, i) => {
      const p = Array.isArray(s) ? { x: s[0], y: s[1] } : s;
      if (i > 0) t += p.ms || opts.stepMs || 700;
      moves.push({ t, p });
      if (p.click || p.onClick) presses.push({ t, p });
      if (p.click || p.onClick || p.hold) { t += p.hold || 320; moves.push({ t, p }); }
    });
    const total = Math.max(t, 1);
    const moveEase = cssEase(opts.ease || "inOut");
    tween(pointerEl, moves.map(({ t: mt, p }) => ({ offset: mt / total, translate: `${p.x}px ${p.y}px`, easing: moveEase })), { ms: total, delay, ease: "linear", kind: "cursor" });
    if (!presses.length) return;
    const d = Math.min(0.5, 110 / total);
    const kf = [{ offset: 0, scale: 1 }];
    presses.forEach(({ t: pt }) => {
      const o = pt / total;
      const last = kf[kf.length - 1].offset;
      kf.push({ offset: Math.min(1, Math.max(last, o)), scale: 1 });
      kf.push({ offset: Math.min(1, Math.max(last, o + d)), scale: 0.8 });
      kf.push({ offset: Math.min(1, Math.max(last, o + 2 * d)), scale: 1 });
    });
    if (kf[kf.length - 1].offset < 1) kf.push({ offset: 1, scale: 1 });
    tween(pointerEl, kf, { ms: total, delay, ease: "linear", kind: "cursor" });
    presses.forEach(({ t: pt, p }) => at(delay + pt + 90, () => {
      if (p.click) p.click.classList.add("is-clicked");
      if (p.onClick) p.onClick();
    }));
  }

  // ambient(target, keyframes, { ms, ease, alternate: true, delay }) — idle loop, live only (never in ?still).
  function ambient(target, keyframes, opts = {}) {
    if (isStill) return [];
    note("ambient");
    return toEls(target).map((el) => track(el.animate(keyframes, {
      duration: opts.ms || 2400, delay: opts.delay || 0, easing: cssEase(opts.ease || "inOut"),
      iterations: Infinity, direction: opts.alternate === false ? "normal" : "alternate",
    }), true));
  }

  // countUp(el, to, ms, { from, decimals, prefix, suffix, delay, ease }) — numeric roll-up.
  function countUp(el, to, ms, opts = {}) {
    if (!el) return;
    note("countUp");
    const from = opts.from || 0;
    const d = opts.decimals || 0;
    const fmt = (v) => `${opts.prefix || ""}${v.toLocaleString(META.lang || undefined, { minimumFractionDigits: d, maximumFractionDigits: d })}${opts.suffix || ""}`;
    el.textContent = fmt(from);
    animate(ms, (t) => { el.textContent = fmt(from + (to - from) * t); }, opts);
  }

  // typewriter(el, text, ms, { delay }) — reveal text character by character.
  function typewriter(el, text, ms, opts = {}) {
    if (!el) return;
    note("typewriter");
    const chars = Array.from(text);
    el.textContent = "";
    animate(ms, (t) => { el.textContent = chars.slice(0, Math.round(chars.length * t)).join(""); }, { ...opts, ease: "linear" });
  }

  const helpers = {
    at, animate, tween, spring, stagger, splitText, rise, unveil, focus, wipe, iris, stamp, shake, strike,
    draw, followPath, morph, cursor, ambient, countUp, typewriter, isStill, isVideo,
  };

  // ---- beat changes: MOTION.transition, overridden per beat by beat.transition ----
  const OPPOSITE = { left: "right", right: "left", up: "down", down: "up" };
  function transitionSpec(beat, reverse) {
    let raw = beat && beat.transition !== undefined ? beat.transition : MOTION.transition;
    if (typeof raw === "string") raw = { type: raw };
    const spec = { ...(raw || { type: "fade" }) };
    const m = /^(push|cover|reveal|wipe)-(left|right|up|down)$/.exec(spec.type || "");
    if (m) { spec.type = m[1]; spec.dir = spec.dir || m[2]; }
    if (/^(push|cover|reveal|wipe)$/.test(spec.type) && !spec.dir) spec.dir = "left";
    if (reverse && spec.dir) spec.dir = OPPOSITE[spec.dir];
    spec.reverse = Boolean(reverse);
    return spec;
  }
  function stageScale() { return stage.getBoundingClientRect().width / 1920 || 1; }
  function stagePoint(el) {
    const s = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const k = stageScale();
    return { x: (r.left + r.width / 2 - s.left) / k, y: (r.top + r.height / 2 - s.top) / k };
  }
  let running = [];
  let leaving = null;
  let hiddenForMatch = [];
  function finishTransition() {
    running.forEach((a) => a.cancel());
    running = [];
    hiddenForMatch.forEach((el) => { el.style.visibility = ""; });
    hiddenForMatch = [];
    if (leaving) leaving.classList.remove("is-leaving", "on-top");
    leaving = null;
  }
  function playTransition(fromEl, toEl, spec) {
    const type = spec.type || "fade";
    if (type === "cut") return;
    const ms = spec.ms || (type === "camera" ? parseFloat(getComputedStyle(stage).getPropertyValue("--cam-ms")) || 900 : 640);
    const easing = cssEase(spec.ease || (type === "fade" || type === "blur" ? "inOut" : "inOut"));
    const o = { duration: ms, easing, fill: "both" };
    const run = (el, kf, opts = o) => { const a = el.animate(kf, { ...opts, id: "bd-change" }); running.push(a); return a; };
    leaving = fromEl;
    fromEl.classList.add("is-leaving");
    const top = (el) => { if (el === fromEl) fromEl.classList.add("on-top"); };
    const W = 1920, H = 1080;
    const vec = { left: [-W, 0], right: [W, 0], up: [0, -H], down: [0, H] }[spec.dir] || [-W, 0];
    const off = (f) => `translate(${vec[0] * f}px, ${vec[1] * f}px)`;
    let origin = { x: W / 2, y: H / 2 };
    if (spec.origin && typeof spec.origin === "object") origin = spec.origin;
    else if (typeof spec.origin === "string") {
      const host = (spec.reverse ? fromEl : toEl).querySelector(spec.origin);
      if (host) origin = stagePoint(host);
    }
    const ox = `${origin.x}px ${origin.y}px`;
    const radius = Math.hypot(Math.max(origin.x, W - origin.x), Math.max(origin.y, H - origin.y)) + 4;
    let main = null;
    if (type === "fade") main = run(toEl, { opacity: [0, 1] });
    else if (type === "dip") { run(fromEl, { opacity: [1, 0] }, { ...o, duration: ms * 0.45 }); main = run(toEl, { opacity: [0, 1] }, { ...o, delay: ms * 0.45, duration: ms * 0.55 }); }
    else if (type === "push") { main = run(toEl, { transform: [off(-1), "none"] }); run(fromEl, { transform: ["none", off(1)] }); }
    else if (type === "cover") { main = run(toEl, { transform: [off(-1), "none"] }); run(fromEl, { transform: ["none", off(0.18)], filter: ["brightness(1)", "brightness(0.7)"] }); }
    else if (type === "reveal") { top(fromEl); main = run(fromEl, { transform: ["none", off(1)] }); run(toEl, { transform: [off(-0.18), "none"] }); }
    else if (type === "wipe") {
      const from = { left: "inset(0 0 0 100%)", right: "inset(0 100% 0 0)", up: "inset(100% 0 0 0)", down: "inset(0 0 100% 0)" }[spec.dir];
      main = run(toEl, { clipPath: [from, "inset(0 0 0 0)"] });
    } else if (type === "iris") {
      if (spec.reverse) { top(fromEl); main = run(fromEl, { clipPath: [`circle(${radius}px at ${ox})`, `circle(0px at ${ox})`] }); }
      else main = run(toEl, { clipPath: [`circle(0px at ${ox})`, `circle(${radius}px at ${ox})`] });
    } else if (type === "zoom") {
      const into = { transformOrigin: ox };
      if (spec.reverse) { main = run(toEl, { transform: ["scale(1.4)", "none"], opacity: [0, 1], ...into }); run(fromEl, { transform: ["none", "scale(0.86)"], ...into }); }
      else { top(fromEl); main = run(fromEl, { transform: ["none", "scale(1.4)"], opacity: [1, 0], ...into }); run(toEl, { transform: ["scale(0.86)", "none"], ...into }); }
    } else if (type === "blur") {
      main = run(toEl, { opacity: [0, 1], filter: ["blur(22px)", "blur(0px)"] });
      run(fromEl, { filter: ["blur(0px)", "blur(22px)"] });
    } else if (type === "match") main = playMatch(fromEl, toEl, o, run);
    else if (type === "camera") main = run(toEl, { opacity: [1, 1] });
    else main = run(toEl, { opacity: [0, 1] });
    if (main) main.onfinish = () => { if (leaving === fromEl) finishTransition(); };
  }
  // match: elements sharing data-match="key" in both scenes fly from the old place to the new one,
  // the rest of the new scene fades in around them. Best between beats that share the camera.
  function playMatch(fromEl, toEl, o, run) {
    const pairs = [];
    toEl.querySelectorAll("[data-match]").forEach((el) => {
      const src = fromEl.querySelector(`[data-match="${CSS.escape(el.dataset.match)}"]`);
      if (src) pairs.push([src, el]);
    });
    const matched = new Set(pairs.map((p) => p[1]));
    const fadeSet = [];
    const walk = (node) => Array.from(node.children).forEach((c) => {
      if (matched.has(c)) return;
      if (Array.from(matched).some((m) => c.contains(m))) walk(c); else fadeSet.push(c);
    });
    walk(toEl);
    fadeSet.forEach((el) => run(el, { opacity: [0, 1] }, { ...o, delay: o.duration * 0.35, duration: o.duration * 0.65 }));
    run(fromEl, { opacity: [1, 0] }, { ...o, duration: o.duration * 0.5 });
    let main = run(toEl, { opacity: [1, 1] });
    pairs.forEach(([src, el]) => {
      const a = src.getBoundingClientRect();
      const b = el.getBoundingClientRect();
      el.style.translate = "100px 0px";
      const k = (el.getBoundingClientRect().left - b.left) / 100 || stageScale();
      el.style.translate = "";
      src.style.visibility = "hidden";
      hiddenForMatch.push(src);
      const dx = (a.left + a.width / 2 - (b.left + b.width / 2)) / k;
      const dy = (a.top + a.height / 2 - (b.top + b.height / 2)) / k;
      const sx = b.width ? a.width / b.width : 1;
      const sy = b.height ? a.height / b.height : 1;
      main = run(el, { translate: [`${dx}px ${dy}px`, "0px 0px"], scale: [`${sx} ${sy}`, "1 1"], transformOrigin: ["50% 50%", "50% 50%"], transformBox: ["fill-box", "fill-box"] });
    });
    return main;
  }

  function estimateSeconds(b) {
    if (typeof b.duration === "number" && b.duration > 0) return b.duration;
    const say = (b.say || "").trim();
    const cjk = (say.match(/[㐀-䶿一-鿿぀-ヿ]/g) || []).length;
    const latin = (say.replace(/[㐀-䶿一-鿿぀-ヿ]/g, " ").match(/[A-Za-z0-9]+(?:[._'-][A-Za-z0-9]+)*/g) || []).length;
    return Math.max(1.5, cjk / (META.speechRate || 3.6) + latin / 2.5);
  }

  function clampIndex(i) {
    const n = Number.isFinite(i) ? Math.trunc(i) : 0;
    return Math.max(0, Math.min(BEATS.length - 1, n));
  }

  // Fit the 1920x1080 stage into the visible viewport and centre it explicitly, so the result
  // never depends on how a host page (iframe, artifact wrapper, preview pane) sizes <body>.
  function fitStage() {
    const vp = document.getElementById("viewport");
    const vw = (vp && vp.clientWidth) || window.innerWidth || 1920;
    const vh = (vp && vp.clientHeight) || window.innerHeight || 1080;
    const s = Math.min(vw / 1920, vh / 1080);
    stage.style.transform = `translate(${(vw - 1920 * s) / 2}px, ${(vh - 1080 * s) / 2}px) scale(${s})`;
  }
  if (window.ResizeObserver) new ResizeObserver(() => fitStage()).observe(document.getElementById("viewport"));

  function setCamera(cam) {
    const c = cam || { x: 0, y: 0, scale: 1 };
    world.style.transform = `translate(${-c.x * c.scale}px, ${-c.y * c.scale}px) scale(${c.scale})`;
    // Parallax: data-depth="0.4" drifts at 40% of the camera move (far), "1.5" moves faster (near).
    // Each layer sits where it was authored when the camera is at its own scene's `cam`.
    world.querySelectorAll("[data-depth]").forEach((el) => {
      const d = parseFloat(el.dataset.depth);
      if (!Number.isFinite(d)) return;
      const home = el.closest(".scene");
      const hi = home ? scenes.indexOf(home) : -1;
      const ref = (hi >= 0 && BEATS[hi].cam) || { x: 0, y: 0 };
      el.style.translate = `${(1 - d) * (c.x - (ref.x || 0))}px ${(1 - d) * (c.y - (ref.y || 0))}px`;
    });
  }

  let rendered = false;
  function renderBeat(index) {
    clearTimeline();
    finishTransition();
    const from = rendered ? active : null;
    const fromEl = from === null ? null : scenes[from];
    if (fromEl) settleSceneAnims(fromEl);
    active = clampIndex(index);
    rendered = true;
    const beat = BEATS[active];
    const toEl = scenes[active];
    if (toEl) cancelSceneAnims(toEl);
    currentScene = toEl;
    setCamera(beat.cam);
    scenes.forEach((el, i) => el && el.classList.toggle("is-active", i === active));
    // Forward uses the entered beat's transition; going back replays the left beat's transition reversed.
    const back = from !== null && active < from;
    const spec = transitionSpec(back ? BEATS[from] : beat, back);
    document.body.dataset.beatTransition = from === null || from === active ? "" : spec.type;

    const pad = (n) => String(n).padStart(2, "0");
    $("hud-counter").textContent = `${pad(active + 1)} / ${pad(BEATS.length)}`;
    $("nd-head").textContent = `BEAT ${pad(active + 1)} / ${pad(BEATS.length)} · ${beat.chapter || ""} · ${beat.speaker || ""} · ~${estimateSeconds(beat).toFixed(1)}s`;
    $("nd-say").textContent = beat.say || "";
    $("nd-cue").textContent = beat.note || "";

    const choreo = CHOREO[beat.id];
    if (typeof choreo === "function") choreo(toEl, helpers);
    if (fromEl && toEl && fromEl !== toEl && !isStill) playTransition(fromEl, toEl, spec);
    if (isStill) void world.offsetHeight;
  }

  function setSubtitle(text) {
    const t = typeof text === "string" ? text.trim() : "";
    subtitleEl.textContent = t;
    subtitleEl.classList.toggle("is-visible", Boolean(t) && !isStill && !isBare);
  }

  function toggleNotes(force) {
    notesOpen = typeof force === "boolean" ? force : !notesOpen;
    notes.classList.toggle("is-open", notesOpen);
    $("btn-notes").classList.toggle("is-on", notesOpen);
  }
  function toggleCam(force) {
    camOpen = typeof force === "boolean" ? force : !camOpen;
    camZone.classList.toggle("is-open", camOpen);
    $("btn-cam").classList.toggle("is-on", camOpen);
  }
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.().catch(() => {});
  }

  window.__beatdeck = {
    version: "1.0",
    meta: { ...META },
    list: () => BEATS.map((b, index) => ({
      index, id: b.id, chapter: b.chapter, speaker: b.speaker, say: b.say || "",
      duration: b.duration, note: b.note, pdfSkip: Boolean(b.pdfSkip),
    })),
    current: () => active,
    goTo: (i) => { renderBeat(i); return active; },
    setSubtitle,
  };

  if (!chromeHidden) {
    window.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
      const k = e.key;
      const act = {
        ArrowRight: () => renderBeat(active + 1), " ": () => renderBeat(active + 1), PageDown: () => renderBeat(active + 1),
        ArrowLeft: () => renderBeat(active - 1), PageUp: () => renderBeat(active - 1), Backspace: () => renderBeat(active - 1),
        Home: () => renderBeat(0), End: () => renderBeat(BEATS.length - 1),
        n: toggleNotes, N: toggleNotes, c: toggleCam, C: toggleCam, f: toggleFullscreen, F: toggleFullscreen,
      }[k];
      if (act) { e.preventDefault(); act(); }
    });
    $("viewport").addEventListener("click", (e) => {
      if (e.target.closest("#hud") || e.target.closest("#notes-drawer")) return;
      renderBeat(e.clientX < window.innerWidth * 0.25 ? active - 1 : active + 1);
    });
    $("btn-prev").addEventListener("click", () => renderBeat(active - 1));
    $("btn-next").addEventListener("click", () => renderBeat(active + 1));
    $("btn-notes").addEventListener("click", () => toggleNotes());
    $("btn-cam").addEventListener("click", () => toggleCam());
    $("btn-fs").addEventListener("click", toggleFullscreen);
  }
  window.addEventListener("resize", fitStage);

  (async function init() {
    fitStage();
    const p = parseInt(params.get("p") || "1", 10);
    const start = Number.isFinite(p) ? clampIndex(p - 1) : 0;
    if (document.fonts && document.fonts.ready) {
      await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]);
    }
    world.style.transition = "none";
    renderBeat(start);
    void world.offsetHeight;
    requestAnimationFrame(() => {
      if (!isStill) world.style.transition = "";
      document.body.dataset.ready = "1";
    });
  })();
})();
</script>
</body>
</html>
